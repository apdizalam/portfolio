<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project — Abdisalam Mohamed Muhumed</title>
  <meta name="description" content="Project details from Abdisalam Mohamed Muhumed's portfolio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="bg__glow bg__glow--left"></span>
    <span class="bg__glow bg__glow--right"></span>
    <span class="bg__dots bg__dots--left"></span>
    <span class="bg__dots bg__dots--right"></span>
  </div>

  <div id="root">
    <main>
      <a href="/#projects" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Back to projects
      </a>

      <section class="pd-hero" id="pd-hero">
        <img class="pd-cover" id="pd-cover" alt="" />
        <h1 class="pd-title" id="pd-title">Loading project…</h1>
        <p class="pd-summary" id="pd-summary"></p>
        <ul class="pd-tags" id="pd-tags"></ul>
        <div class="pd-actions" id="pd-actions"></div>
      </section>

      <section class="section" id="pd-app" hidden>
        <h2 class="section__title">Install the mobile app</h2>
        <div class="card app-card">
          <div class="app-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
          </div>
          <div class="app-card__body">
            <p class="app-card__lead">Want to use this app on your phone? Follow these steps:</p>
            <ol class="app-steps" id="pd-app-steps"></ol>
            <a class="btn btn--solid" id="pd-app-link" target="_blank" rel="noopener">Download the app <span aria-hidden="true">→</span></a>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section__title">Overview</h2>
        <article class="card readme" id="readme">
          <p class="readme__status">Loading README from GitHub…</p>
        </article>
      </section>

      <footer class="footer">© <span id="year"></span> Abdisalam Mohamed Muhumed</footer>
    </main>

    <nav class="bottomnav" aria-label="Quick navigation">
      <a href="/#home" class="bottomnav__link">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3L12 3Z"/></svg>
        <span>Home</span>
      </a>
      <a href="/#about" class="bottomnav__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>
        <span>About</span>
      </a>
      <a href="/#projects" class="bottomnav__link is-active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Projects</span>
      </a>
      <a href="/#skills" class="bottomnav__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="1.8"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/></svg>
        <span>Skills</span>
      </a>
      <a href="/#contact" class="bottomnav__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span>Contact</span>
      </a>
      <button type="button" class="bottomnav__link theme-toggle" aria-label="Switch color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        <span class="theme-label">Light</span>
      </button>
    </nav>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="content.js"></script>
  <script src="theme.js"></script>
  <script src="project-page.js"></script>
</body>
</html>
